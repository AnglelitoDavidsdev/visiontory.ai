<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionTory.ai · Sign In</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <style>
        /* ============================================================
                   ROOT VARIABLES
                   ============================================================ */
        :root {
            --bg-primary: #0b0e1a;
            --bg-secondary: #11152a;
            --bg-card: #161b36;
            --bg-card-hover: #1e2450;
            --border-color: rgba(255, 255, 255, 0.06);
            --text-primary: #f0f4ff;
            --text-secondary: #8899cc;
            --text-muted: #556688;
            --accent-blue: #4a8cff;
            --accent-cyan: #00d4ff;
            --accent-green: #00e676;
            --accent-orange: #ffab00;
            --accent-red: #ff5252;
            --accent-purple: #b388ff;
            --accent-pink: #ff6b9d;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.3s ease;
            --theme-accent: var(--accent-pink);
            --theme-gradient: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
            --theme-bg-glow: rgba(255, 107, 157, 0.08);
        }

        /* ----- Industrial Theme ----- */
        [data-theme="industrial"] {
            --theme-accent: #ff8c00;
            --theme-gradient: linear-gradient(135deg, #ff8c00, #ff5500);
            --theme-bg-glow: rgba(255, 140, 0, 0.08);
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: #181825;
            --bg-card-hover: #22223a;
        }

        /* ----- Medical Theme ----- */
        [data-theme="medical"] {
            --theme-accent: #00b8d4;
            --theme-gradient: linear-gradient(135deg, #00b8d4, #0077b6);
            --theme-bg-glow: rgba(0, 184, 212, 0.08);
            --bg-primary: #080e1a;
            --bg-secondary: #0d1a2e;
            --bg-card: #12243f;
            --bg-card-hover: #1a3055;
        }

        /* ============================================================
                   RESET & BASE
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* ============================================================
                   THEME TOGGLE (top right)
                   ============================================================ */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 50;
            display: flex;
            gap: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 4px;
        }

        .theme-toggle button {
            padding: 6px 16px;
            border: none;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all var(--transition);
            background: transparent;
            color: var(--text-muted);
        }

        .theme-toggle button.active {
            background: var(--theme-gradient);
            color: #fff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }

        .theme-toggle button:hover:not(.active) {
            color: var(--text-primary);
        }

        /* ============================================================
                   LOGIN CONTAINER
                   ============================================================ */
        .login-container {
            display: flex;
            max-width: 1000px;
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
        }

        /* ----- Left Panel (Branding) ----- */
        .login-brand {
            flex: 1;
            padding: 48px 40px;
            background: var(--theme-gradient);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 480px;
            position: relative;
            overflow: hidden;
        }

        .login-brand::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .login-brand>* {
            position: relative;
            z-index: 2;
        }

        .login-brand .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .login-brand .logo .icon {
            font-size: 28px;
            width: 48px;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: #fff;
            backdrop-filter: blur(4px);
        }

        .login-brand .logo h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }

        .login-brand .logo h1 small {
            display: block;
            font-size: 11px;
            font-weight: 400;
            opacity: 0.7;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .login-brand .tagline {
            font-size: 18px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.9);
            line-height: 1.5;
        }

        .login-brand .tagline span {
            display: block;
            font-size: 13px;
            font-weight: 400;
            opacity: 0.7;
            margin-top: 4px;
        }

        .login-brand .features {
            display: flex;
            gap: 24px;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .login-brand .features .item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .login-brand .features .item i {
            font-size: 16px;
            opacity: 0.8;
        }

        /* ----- Right Panel (Form) ----- */
        .login-form {
            flex: 1;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-width: 320px;
        }

        .login-form .header {
            margin-bottom: 32px;
        }

        .login-form .header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
        }

        .login-form .header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 4px;
        }

        .login-form .form-group {
            margin-bottom: 16px;
        }

        .login-form .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .login-form .form-group input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: all var(--transition);
        }

        .login-form .form-group input:focus {
            border-color: var(--theme-accent);
            box-shadow: 0 0 0 3px var(--theme-bg-glow);
        }

        .login-form .form-group input::placeholder {
            color: var(--text-muted);
        }

        .login-form .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 8px 0 20px;
            font-size: 13px;
        }

        .login-form .form-options label {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
            cursor: pointer;
        }

        .login-form .form-options label input[type="checkbox"] {
            accent-color: var(--theme-accent);
            width: 16px;
            height: 16px;
        }

        .login-form .form-options a {
            color: var(--theme-accent);
            text-decoration: none;
            font-weight: 500;
        }

        .login-form .form-options a:hover {
            text-decoration: underline;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: var(--radius-sm);
            background: var(--theme-gradient);
            color: #fff;
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        .login-form .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .login-form .divider::before,
        .login-form .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }

        .btn-google {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-google:hover {
            background: var(--bg-card);
            border-color: var(--theme-accent);
            color: var(--text-primary);
        }

        .btn-google i {
            font-size: 18px;
            color: #ea4335;
        }

        .login-form .signup-link {
            text-align: center;
            margin-top: 16px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .login-form .signup-link a {
            color: var(--theme-accent);
            text-decoration: none;
            font-weight: 600;
        }

        .login-form .signup-link a:hover {
            text-decoration: underline;
        }

        .login-form .status-badge {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 24px;
            font-size: 11px;
            color: var(--text-muted);
        }

        .login-form .status-badge .item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .login-form .status-badge .item .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .login-form .status-badge .item .dot.green {
            background: var(--accent-green);
        }
        .login-form .status-badge .item .dot.blue {
            background: var(--accent-blue);
        }
        .login-form .status-badge .item .dot.orange {
            background: var(--accent-orange);
        }

        /* ============================================================
                   RESPONSIVE
                   ============================================================ */
        @media (max-width: 820px) {
            .login-container {
                flex-direction: column;
                max-width: 440px;
            }
            .login-brand {
                padding: 32px 28px;
                min-height: 200px;
            }
            .login-brand .tagline {
                font-size: 16px;
            }
            .login-brand .features {
                flex-wrap: wrap;
                gap: 12px;
            }
            .login-form {
                padding: 32px 28px;
                min-width: unset;
            }
            .theme-toggle {
                top: 12px;
                right: 12px;
            }
            .theme-toggle button {
                padding: 4px 12px;
                font-size: 10px;
            }
        }

        @media (max-width: 480px) {
            .login-brand {
                padding: 24px 20px;
                min-height: 160px;
            }
            .login-brand .logo h1 {
                font-size: 22px;
            }
            .login-brand .tagline {
                font-size: 14px;
            }
            .login-form {
                padding: 24px 20px;
            }
            .login-form .header h2 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
    THEME TOGGLE
    ============================================================ -->
    <div class="theme-toggle">
        <button class="active" data-theme-btn="industrial" onclick="setTheme('industrial')">
            <i class="fas fa-industry"></i> Industrial
        </button>
        <button data-theme-btn="medical" onclick="setTheme('medical')">
            <i class="fas fa-heartbeat"></i> Medical
        </button>
    </div>

    <!-- ============================================================
    LOGIN CONTAINER
    ============================================================ -->
    <div class="login-container" id="loginContainer">

        <!-- Left: Branding -->
        <div class="login-brand">
            <div class="logo">
                <div class="icon">V</div>
                <h1>
                    VisionTory.ai
                    <small>AI Inventory Control</small>
                </h1>
            </div>

            <div class="tagline" id="tagline">
                Industrial inventory control
                <span>for manufacturing, mining, and aviation.</span>
            </div>

            <div class="features">
                <div class="item"><i class="fas fa-shield-alt"></i> Secure access</div>
                <div class="item"><i class="fas fa-qrcode"></i> Scan ready</div>
                <div class="item"><i class="fas fa-circle"></i> Live status</div>
            </div>
        </div>

        <!-- Right: Form -->
        <div class="login-form">
            <div class="header">
                <h2>Sign in</h2>
                <p>Access your inventory dashboard</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="ops@facility.com" value="ops@facility.com" />
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="••••••••••" value="password123" />
                </div>

                <div class="form-options">
                    <label>
                        <input type="checkbox" checked /> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Sign in with email
                </button>
            </form>

            <div class="signup-link">
                New to VisionTory.ai? <a href="#">Create account</a>
            </div>

            <div class="divider">OR</div>

            <button class="btn-google">
                <i class="fab fa-google"></i> Continue with Google
            </button>

            <div class="status-badge">
                <span class="item"><span class="dot green"></span> Secure access</span>
                <span class="item"><span class="dot blue"></span> Scan ready</span>
                <span class="item"><span class="dot orange"></span> Live status</span>
            </div>
        </div>

    </div>

    <!-- ============================================================
    JAVASCRIPT
    ============================================================ -->
    <script>
        // ============================================================
        //  THEME SWITCHING
        // ============================================================
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);

            // Update tagline
            const tagline = document.getElementById('tagline');
            if (theme === 'industrial') {
                tagline.innerHTML = `
                            Industrial inventory control
                            <span>for manufacturing, mining, and aviation.</span>
                        `;
            } else {
                tagline.innerHTML = `
                            Medical inventory control
                            <span>for pharmaceuticals, clinics, and healthcare.</span>
                        `;
            }

            // Update toggle buttons
            document.querySelectorAll('[data-theme-btn]').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.themeBtn === theme);
            });
        }

        // ============================================================
        //  LOGIN HANDLER
        // ============================================================
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (email && password) {
                // Get current theme
                const theme = document.documentElement.getAttribute('data-theme') || 'industrial';

                // Redirect to dashboard with theme parameter
                window.location.href = `visiontory_dashboard.html?theme=${theme}`;
            } else {
                alert('Please enter your email and password.');
            }
        });

        // ============================================================
        //  KEYBOARD SHORTCUT: Ctrl+1 (Industrial), Ctrl+2 (Medical)
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === '1') {
                e.preventDefault();
                setTheme('industrial');
            } else if (e.ctrlKey && e.key === '2') {
                e.preventDefault();
                setTheme('medical');
            }
        });

        // ============================================================
        //  LOG
        // ============================================================
        console.log('🏭 VisionTory.ai Login');
        console.log('📌 Ctrl+1 = Industrial | Ctrl+2 = Medical');
    </script>
</body>
</html>
