<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionTory.ai</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        const SUPABASE_URL = 'https://lymobhzjswiuymcbcabq.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_dz-2RaJJ2ZS0v301P5SuPQ_0LSEFSjT'; 
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // Get key from AI Studio: https://aistudio.google.com/app/apikey
        const GOOGLE_API_KEY = 'YOUR_GOOGLE_API_KEY'; 
    </script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f1117; color: #e5e7eb; min-height: 100vh; }
        
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 12px 15px; background: #1a1d29; border-bottom: 1px solid #2d3142; position: sticky; top: 0; z-index: 100; }
        .logo-box { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.1rem; color: white; }
        .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #d946ef, #8b5cf6); border-radius: 8px; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.1rem; }
        .logout-btn { background: transparent; border: 1px solid #555; color: #ccc; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-size: 0.85rem; }

        .container { max-width: 800px; margin: 0 auto; padding: 15px; }
        
        .auth-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100%; padding: 15px; }
        .auth-card { background: #1a1d29; border: 1px solid #2d3142; border-radius: 16px; padding: 25px; width: 100%; max-width: 400px; text-align: center; }
        .auth-title { font-size: 1.3rem; margin-bottom: 15px; color: white; }
        .auth-input { width: 100%; padding: 14px; margin-bottom: 15px; background: #0f1117; border: 1px solid #2d3142; border-radius: 8px; color: white; font-size: 1rem; }
        .auth-btn { width: 100%; padding: 15px; background: linear-gradient(135deg, #d946ef, #8b5cf6); border: none; color: white; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: 600; margin-bottom: 10px; }
        .switch-auth { color: #888; font-size: 0.9rem; margin-top: 10px; }
        .switch-auth a { color: #d946ef; cursor: pointer; font-weight: bold; }

        .tabs { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; }
        .tab { padding: 10px 15px; color: #888; cursor: pointer; border-radius: 8px; white-space: nowrap; }
        .tab.active { color: white; background: #2d3142; }

        .stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #1a1d29; border: 1px solid #2d3142; border-radius: 12px; padding: 15px; text-align: center; }
        .stat-number { font-size: 1.8rem; font-weight: 800; color: white; }

        table { width: 100%; border-collapse: collapse; background: #1a1d29; border-radius: 12px; overflow: hidden; }
        th { background: #2d3142; text-align: left; padding: 10px; color: #888; font-size: 0.8rem; }
        td { padding: 10px; border-bottom: 1px solid #2d3142; font-size: 0.9rem; }
        
        .upload-card { background: #1a1d29; border: 2px dashed #2d3142; border-radius: 12px; padding: 40px; text-align: center; }
        .btn-primary { background: linear-gradient(135deg, #d946ef, #8b5cf6); color: white; padding: 15px; border-radius: 8px; border: none; font-size: 1rem; width: 100%; margin-top: 10px; cursor: pointer; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; }
        .modal { background: #1a1d29; border: 1px solid #2d3142; border-radius: 16px; padding: 20px; width: 90%; max-width: 400px; }
        #map { height: 200px; width: 100%; border-radius: 8px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginScreen" class="auth-screen">
        <div class="auth-card">
            <div class="auth-title">VisionTory.ai</div>
            <input type="email" id="loginEmail" class="auth-input" placeholder="Email address">
            <input type="password" id="loginPassword" class="auth-input" placeholder="Password">
            <button class="auth-btn" onclick="handleLogin()">Login</button>
            <div class="switch-auth">Don't have an account? <a onclick="showSignUp()">Sign Up</a></div>
        </div>
    </div>

    <!-- SIGN UP -->
    <div id="signUpScreen" class="auth-screen" style="display: none;">
        <div class="auth-card">
            <div class="auth-title">Create Account</div>
            <input type="email" id="signUpEmail" class="auth-input" placeholder="Email address">
            <input type="password" id="signUpPassword" class="auth-input" placeholder="Password">
            <button class="auth-btn" onclick="handleSignUp()">Sign Up</button>
            <div class="switch-auth">Already have an account? <a onclick="showLogin()">Login</a></div>
        </div>
    </div>

    <!-- APP -->
    <div id="appScreen" style="display: none;">
        <nav class="navbar">
            <div class="logo-box"><div class="logo-icon">V</div><span>VisionTory.ai</span></div>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </nav>

        <div class="container">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('dashboard')">Dashboard</div>
                <div class="tab" onclick="switchTab('upload')">Scan</div>
                <div class="tab" onclick="switchTab('jobs')">Jobs</div>
            </div>

            <!-- DASHBOARD -->
            <div id="dashboard" class="page-section active" style="display: block;">
                <div class="stats">
                    <div class="stat-card"><div class="stat-label">Items</div><div class="stat-number" id="totalItems">0</div></div>
                    <div class="stat-card"><div class="stat-label">Critical</div><div class="stat-number" id="lowStock" style="color: #ef4444;">0</div></div>
                </div>
                <table>
                    <thead><tr><th>Item</th><th>Type</th><th>Qty</th><th>Status</th></tr></thead>
                    <tbody id="inventoryTableBody"></tbody>
                </table>
            </div>

            <!-- UPLOAD -->
            <div id="upload" class="page-section" style="display: none;">
                <div class="upload-card" id="dropZone">
                    <h3 style="margin-bottom: 15px;">Scan Equipment</h3>
                    <button class="btn-primary" id="browseBtn">📂 Browse Files</button>
                    <input type="file" id="fileInput" style="display: none;" accept="image/*">
                </div>
            </div>

            <!-- JOBS -->
            <div id="jobs" class="page-section" style="display: none;">
                <div style="margin-bottom: 15px;">
                    <button class="btn-primary" onclick="openJobModal()">+ New Job</button>
                </div>
                <table>
                    <thead><tr><th>Job</th><th>Location</th><th>Status</th></tr></thead>
                    <tbody id="jobTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JOB MODAL -->
    <div class="modal-overlay" id="jobModal">
        <div class="modal">
            <h3 style="margin-bottom: 10px; color: white;">Create Job</h3>
            <input type="text" id="jobLocationInput" class="auth-input" placeholder="Job Location" oninput="updateMapLocation()">
            <div id="map"></div>
            <input type="text" id="jobName" class="auth-input" placeholder="Job Name">
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary" onclick="closeJobModal()" style="flex: 1; background: #2d3142;">Cancel</button>
                <button class="btn-primary" onclick="saveJob()" style="flex: 1;">Save</button>
            </div>
        </div>
    </div>

    <script>
        let currentUserID = null;
        let inventory = [];
        let jobs = [];
        let map, marker;

        // LOGIN
        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const { error } = await db.auth.signInWithPassword({ email, password });
            if (error) alert('Login failed: ' + error.message);
            else onAuthSuccess();
        }

        async function handleSignUp() {
            const email = document.getElementById('signUpEmail').value;
            const password = document.getElementById('signUpPassword').value;
            const { error } = await db.auth.signUp({ email, password });
            if (error) alert('Sign up failed: ' + error.message);
            else alert('Account created! Please log in.');
        }

        async function onAuthSuccess() {
            const { data: { user } } = await db.auth.getUser();
            currentUserID = user.id;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('signUpScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            loadData();
        }

        async function handleLogout() {
            await db.auth.signOut();
            location.reload();
        }

        function showSignUp() { document.getElementById('loginScreen').style.display = 'none'; document.getElementById('signUpScreen').style.display = 'flex'; }
        function showLogin() { document.getElementById('signUpScreen').style.display = 'none'; document.getElementById('loginScreen').style.display = 'flex'; }

        async function checkAuth() {
            const { data: { user } } = await db.auth.getUser();
            if (user) onAuthSuccess();
            else document.getElementById('loginScreen').style.display = 'flex';
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.page-section').forEach(el => el.style.display = 'none');
            document.getElementById(tabId).style.display = 'block';
            if(tabId === 'dashboard') renderDashboard();
            if(tabId === 'jobs') renderJobs();
        }

        // DATA
        async function loadData() {
            const inv = await db.from('inventory').select('*').eq('user_id', currentUserID);
            inventory = inv.data || [];
            const job = await db.from('jobs').select('*').eq('user_id', currentUserID);
            jobs = job.data || [];
            renderDashboard();
            renderJobs();
        }

        async function addItemToDB(newItem) {
            const uniqueId = Date.now().toString(36) + Math.random().toString(36).substring(2);
            await db.from('inventory').insert([{ id: uniqueId, user_id: currentUserID, ...newItem }]);
            loadData();
        }

        function renderDashboard() {
            const tbody = document.getElementById('inventoryTableBody');
            tbody.innerHTML = '';
            let total = 0, critical = 0;
            inventory.forEach(item => {
                total += item.qty || 0;
                if (item.status === 'Critical') critical++;
                tbody.innerHTML += `<tr><td>${item.name || "Unknown"}</td><td>${item.item_type || "Reusable"}</td><td>${item.qty || 0}</td><td>${item.status || "In Stock"}</td></tr>`;
            });
            document.getElementById('totalItems').innerText = total;
            document.getElementById('lowStock').innerText = critical;
        }

        // JOBS
        function openJobModal() {
            document.getElementById('jobName').value = '';
            document.getElementById('jobLocationInput').value = '';
            document.getElementById('jobModal').style.display = 'flex';
            setTimeout(() => {
                if (!map) { map = L.map('map').setView([-26.2041, 28.0473], 6); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); }
                else map.invalidateSize();
            }, 100);
        }

        function closeJobModal() { document.getElementById('jobModal').style.display = 'none'; }

        function updateMapLocation() {
            const location = document.getElementById('jobLocationInput').value;
            if (!location || !map) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}`)
                .then(res => res.json()).then(data => {
                    if (data.length > 0) {
                        const lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
                        if (!marker) marker = L.marker([lat, lon]).addTo(map);
                        else marker.setLatLng([lat, lon]);
                        map.setView([lat, lon], 12);
                    }
                });
        }

        async function saveJob() {
            const jobData = {
                job_name: document.getElementById('jobName').value,
                job_location: document.getElementById('jobLocationInput').value,
                status: 'Open'
            };
            const uniqueId = Date.now().toString(36) + Math.random().toString(36).substring(2);
            await db.from('jobs').insert([{ id: uniqueId, user_id: currentUserID, ...jobData }]);
            closeJobModal();
            loadData();
        }

        function renderJobs() {
            const tbody = document.getElementById('jobTableBody');
            tbody.innerHTML = '';
            jobs.forEach(job => {
                tbody.innerHTML += `<tr><td>${job.job_name || "Job"}</td><td>${job.job_location || "-"}</td><td>${job.status}</td></tr>`;
            });
        }

        // UPLOAD
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const browseBtn = document.getElementById('browseBtn');
        browseBtn.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) scanItem(file);
        });

        async function scanItem(file) {
            const reader = new FileReader();
            const base64Image = await new Promise((resolve) => { reader.onload = (e) => resolve(e.target.result.split(',')[1]); reader.readAsDataURL(file); });

            const prompt = "Identify this item. Return ONLY this JSON: {\"name\": \"ITEM\", \"manufacturer\": \"BRAND\", \"item_type\": \"Consumable or Reusable\", \"qty\": 1, \"minStock\": 1, \"status\": \"In Stock\", \"report\": \"1 sentence\"}";

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GOOGLE_API_KEY}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data: base64Image } }] }]
                })
            });

            const data = await response.json();
            let text = data.candidates[0].content.parts[0].text;
            const start = text.indexOf('{'); const end = text.lastIndexOf('}');
            text = text.substring(start, end + 1);
            const parsed = JSON.parse(text);

            await addItemToDB(parsed);
            switchTab('dashboard');
        }

        checkAuth();
    </script>
</body>
</html>
