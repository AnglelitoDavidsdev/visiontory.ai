<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionTory.ai</title>

    <!-- YOUR REAL DEEPSEEK KEY IS BELOW -->
    <script>
        const DEEPSEEK_KEY = 'sk-ac48aa00507043a2906c2b59c579f7ea';
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background: #0f1117; color: white; margin: 0; }
        .navbar { background: #1a1d29; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px; background: #2d3142; border-radius: 6px; cursor: pointer; }
        .tab.active { background: #d946ef; }
        table { width: 100%; border-collapse: collapse; background: #1a1d29; border-radius: 8px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #2d3142; }
        button.small { background: #2d3142; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        .auth-card { background: #1a1d29; padding: 30px; border-radius: 12px; width: 350px; margin: auto; text-align: center; }
        .auth-input { width: 100%; padding: 12px; margin-bottom: 10px; background: #0f1117; border: 1px solid #2d3142; border-radius: 6px; color: white; }
        .upload-card { background: #1a1d29; padding: 30px; border-radius: 12px; text-align: center; border: 2px dashed #2d3142; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #d946ef; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .chat-messages { height: 300px; overflow-y: auto; background: #0f1117; border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .message { margin-bottom: 10px; padding: 10px; border-radius: 8px; }
        .message.user { background: #d946ef; text-align: right; }
        .message.ai { background: #2d3142; }
        #map { height: 200px; border-radius: 8px; background: #1a1d29; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #0f1117; border: 1px solid #2d3142; border-radius: 6px; color: white; }
        .section-header { padding: 10px; border-radius: 8px; margin-bottom: 10px; font-weight: bold; }
        .header-consumable { background: rgba(16, 185, 129, 0.15); color: #10b981; }
        .header-reusable { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; }
        #matrixCanvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; opacity: 0; pointer-events: none; }
        .matrix-on #matrixCanvas { opacity: 0.2; }
    </style>
</head>
<body>

    <!-- LOGIN -->
    <div id="loginScreen" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
        <div class="auth-card">
            <h2>VisionTory.ai</h2>
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="login()" style="background: #d946ef; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px;">Login</button>
            <p style="font-size: 0.9rem; color: #888;">No account needed!</p>
        </div>
    </div>

    <!-- APP -->
    <div id="appScreen" style="display: none;">
        <div class="navbar">
            <div><strong>VisionTory.ai</strong></div>
            <button onclick="logout()" style="background: transparent; border: 1px solid #555; color: white; padding: 8px; border-radius: 6px;">Logout</button>
        </div>

        <div class="container">
            <div class="tabs">
                <div class="tab active" onclick="switchTab('dashboard')">Dashboard</div>
                <div class="tab" onclick="switchTab('scan')">Scan</div>
                <div class="tab" onclick="switchTab('jobs')">Jobs</div>
                <div class="tab" onclick="switchTab('chat')">Vizi Chat</div>
            </div>

            <div id="dashboard">
                <div style="display: flex; gap: 15px; margin-bottom: 20px;">
                    <div style="flex: 1; background: #1a1d29; padding: 20px; border-radius: 8px;"><h3>Items</h3><h1 id="totalItems">0</h1></div>
                    <div style="flex: 1; background: #1a1d29; padding: 20px; border-radius: 8px;"><h3>Critical</h3><h1 id="lowStock" style="color: red;">0</h1></div>
                </div>
                <div class="section-header header-consumable">🧤 Consumables</div>
                <table><thead><tr><th>Item</th><th>Brand</th><th>Color</th><th>Condition</th><th>Qty</th><th>Actions</th></tr></thead><tbody id="consumableTable"></tbody></table>
                <div class="section-header header-reusable">🔧 Reusables</div>
                <table><thead><tr><th>Item</th><th>Brand</th><th>Color</th><th>Condition</th><th>Qty</th><th>Actions</th></tr></thead><tbody id="reusableTable"></tbody></table>
            </div>

            <div id="scan" style="display: none;">
                <canvas id="matrixCanvas"></canvas>
                <div class="upload-card">
                    <h2>Scan Equipment</h2>
                    <button style="background: #d946ef; color: white; padding: 15px; width: 100%; border: none; border-radius: 6px;" onclick="document.getElementById('fileInput').click()">📂 Browse Files</button>
                    <input type="file" id="fileInput" style="display: none;" accept="image/*" onchange="scan(this.files[0])">
                    <div id="loadingIndicator" style="display: none; margin-top: 20px;"><div class="spinner"></div></div>
                </div>
            </div>

            <div id="jobs" style="display: none;">
                <div style="background: #1a1d29; padding: 20px; border-radius: 8px;">
                    <input type="text" id="jobName" placeholder="Job Name">
                    <input type="text" id="jobLocation" placeholder="Location" oninput="updateMap()">
                    <div id="map"></div>
                    <button style="background: #d946ef; color: white; padding: 15px; width: 100%; border: none; border-radius: 6px;" onclick="addJob()">Save Job</button>
                </div>
                <table><thead><tr><th>Job</th><th>Status</th></tr></thead><tbody id="jobTable"></tbody></table>
            </div>

            <div id="chat" style="display: none;">
                <div style="background: #1a1d29; padding: 20px; border-radius: 8px;">
                    <div class="chat-messages" id="chatMsgs"><div class="message ai">Hello!</div></div>
                    <input type="text" id="chatInput" placeholder="Ask..." onkeydown="if(event.key==='Enter') sendChat()">
                </div>
            </div>
        </div>
    </div>

    <script>
        let inventory = JSON.parse(localStorage.getItem('inventory')) || [];
        let jobs = JSON.parse(localStorage.getItem('jobs')) || [];
        let map, marker;
        let matrixInterval;

        function login() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appScreen').style.display = 'block';
            renderData();
        }
        function logout() { window.location.reload(); }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#dashboard, #scan, #jobs, #chat').forEach(d => d.style.display = 'none');
            document.getElementById(tab).style.display = 'block';
            if(tab === 'scan') startMatrix();
            if(tab === 'jobs') setTimeout(initMap, 100);
        }

        function renderData() {
            const consumableTbody = document.getElementById('consumableTable');
            const reusableTbody = document.getElementById('reusableTable');
            consumableTbody.innerHTML = '';
            reusableTbody.innerHTML = '';

            inventory.forEach(i => {
                const row = `<tr><td>${i.name}</td><td>${i.brand || 'Unknown'}</td><td>${i.color || 'N/A'}</td><td>${i.condition || 'Good'}</td><td>${i.qty}</td><td><button class="small" onclick="deleteItem('${i.id}')">Del</button></td></tr>`;
                if (i.item_type === 'Consumable') consumableTbody.innerHTML += row;
                else reusableTbody.innerHTML += row;
            });
            document.getElementById('totalItems').innerText = inventory.length;
            document.getElementById('lowStock').innerText = inventory.filter(i => i.qty <= i.minStock).length;
            
            const jobTbody = document.getElementById('jobTable');
            jobTbody.innerHTML = '';
            jobs.forEach(j => jobTbody.innerHTML += `<tr><td>${j.job_name}</td><td>${j.status || 'Open'}</td></tr>`);
        }

        async function deleteItem(id) {
            if(confirm("Delete?")) {
                inventory = inventory.filter(i => i.id !== id);
                localStorage.setItem('inventory', JSON.stringify(inventory));
                renderData();
            }
        }

        function initMap() {
            if(!map) { map = L.map('map').setView([-26.2041, 28.0473], 6); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); }
            else map.invalidateSize();
        }

        function updateMap() {
            const loc = document.getElementById('jobLocation').value;
            if(!loc || !map) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(loc)}`)
                .then(r => r.json()).then(d => {
                    if(d.length > 0) {
                        if(!marker) marker = L.marker([d[0].lat, d[0].lon]).addTo(map);
                        else marker.setLatLng([d[0].lat, d[0].lon]);
                        map.setView([d[0].lat, d[0].lon], 12);
                    }
                });
        }

        async function addJob() {
            const jobData = { job_name: document.getElementById('jobName').value, job_location: document.getElementById('jobLocation').value, status: 'Open' };
            jobs.push({ id: Date.now().toString(36), ...jobData });
            localStorage.setItem('jobs', JSON.stringify(jobs));
            document.getElementById('jobName').value = '';
            document.getElementById('jobLocation').value = '';
            renderData();
        }

        // THE CORRECT VISION MODEL
        async function scan(file) {
            document.getElementById('loadingIndicator').style.display = 'block';
            const reader = new FileReader();
            const imgData = await new Promise((resolve) => { reader.onload = e => resolve(e.target.result); reader.readAsDataURL(file); });

            const fallback = { id: Date.now().toString(36), name: "Scanned Item", brand: "Unknown", color: "N/A", condition: "Good", item_type: "Reusable", qty: 1, minStock: 1 };

            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DEEPSEEK_KEY}`
                    },
                    body: JSON.stringify({
                        // THIS IS THE VISION MODEL
                        model: "deepseek-vl2", 
                        messages: [
                            { role: "system", content: "You are an inventory inspector. Return ONLY JSON: { 'name': '...', 'brand': '...', 'color': '...', 'condition': 'Excellent, Good, Fair, Poor, or Critical', 'item_type': 'Consumable or Reusable', 'qty': 1, 'minStock': 1 }" },
                            { role: "user", content: "Look at the image: " + imgData }
                        ],
                        max_tokens: 150
                    })
                });

                const data = await response.json();
                let text = data.choices[0].message.content;
                const start = text.indexOf('{');
                const end = text.lastIndexOf('}');
                if(start !== -1 && end !== -1) {
                    text = text.substring(start, end + 1);
                    const result = JSON.parse(text);
                    fallback.name = result.name || fallback.name;
                    fallback.brand = result.brand || fallback.brand;
                    fallback.color = result.color || fallback.color;
                    fallback.condition = result.condition || fallback.condition;
                    fallback.item_type = result.item_type || fallback.item_type;
                }
            } catch(e) {}

            inventory.push(fallback);
            localStorage.setItem('inventory', JSON.stringify(inventory));
            document.getElementById('loadingIndicator').style.display = 'none';
            renderData();
            switchTab('dashboard');
        }

        async function sendChat() {
            const msg = document.getElementById('chatInput').value;
            if(!msg) return;
            const chatMsgs = document.getElementById('chatMsgs');
            chatMsgs.innerHTML += `<div class="message user">${msg}</div>`;
            document.getElementById('chatInput').value = '';
            let answer = "I can't connect.";
            try {
                const response = await fetch('https://api.deepseek.com/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${DEEPSEEK_KEY}`
                    },
                    body: JSON.stringify({ model: "deepseek-chat", messages: [{ role: "user", content: msg }] })
                });
                const data = await response.json();
                answer = data.choices[0].message.content;
            } catch(e) {}
            chatMsgs.innerHTML += `<div class="message ai">${answer}</div>`;
            chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }

        function startMatrix() {
            const canvas = document.getElementById('matrixCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            const chars = "01".split("");
            const fontSize = 14;
            let drops = Array(Math.floor(canvas.width / fontSize)).fill(1);
            document.body.classList.add('matrix-on');
            if(matrixInterval) clearInterval(matrixInterval);
            matrixInterval = setInterval(() => {
                ctx.fillStyle = "rgba(0, 0, 0, 0.04)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#0F0"; ctx.font = fontSize + "px monospace";
                drops.forEach((y, i) => {
                    ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*fontSize, y*fontSize);
                    if(y*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
                    drops[i]++;
                });
            }, 35);
        }

        renderData();
    </script>
</body>
</html>
