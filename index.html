<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisionTory Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.puter.com/v2/"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f1117; color: white; margin: 0; }
        .navbar { background: #1a1d29; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .container { max-width: 800px; margin: auto; padding: 20px; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 10px; background: #2d3142; border-radius: 6px; cursor: pointer; }
        .tab.active { background: #d946ef; }
        table { width: 100%; border-collapse: collapse; background: #1a1d29; border-radius: 8px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #2d3142; }
        button.small { background: #2d3142; border: none; color: white; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
        input { width: 100%; padding: 12px; margin-bottom: 10px; background: #0f1117; border: 1px solid #2d3142; border-radius: 6px; color: white; }
        button.primary { width: 100%; padding: 12px; background: #d946ef; color: white; border: none; border-radius: 6px; cursor: pointer; }
        #map { height: 200px; border-radius: 8px; margin-bottom: 15px; }
        .upload-card { background: #1a1d29; padding: 30px; border-radius: 8px; text-align: center; border: 2px dashed #2d3142; }
        .section-header { padding: 10px; border-radius: 8px; margin-top: 20px; font-weight: 700; }
        .header-consumable { background: rgba(16, 185, 129, 0.15); color: #10b981; border-left: 5px solid #10b981; }
        .header-reusable { background: rgba(139, 92, 246, 0.15); color: #8b5cf6; border-left: 5px solid #8b5cf6; }
        .chat-messages { height: 300px; overflow-y: auto; padding: 10px; background: #0f1117; border-radius: 8px; margin-bottom: 10px; }
        .message.user { text-align: right; color: #d946ef; margin-bottom: 10px; }
        .message.ai { text-align: left; color: white; margin-bottom: 10px; background: #2d3142; padding: 10px; border-radius: 8px; }
        #loadingIndicator { display: none; margin-top: 15px; color: #888; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #d946ef; animation: spin 1s linear infinite; display: inline-block; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="navbar">
        <div><strong>VisionTory.ai</strong></div>
        <button class="small" onclick="logout()">Logout</button>
    </div>
    <div class="container">
        <select class="industry-select" id="industrySelector">
            <option value="industrial">🏭 Industrial</option>
            <option value="medical">🏥 Medical</option>
            <option value="aviation">✈️ Aviation</option>
        </select>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('dashboard')">Dashboard</div>
            <div class="tab" onclick="switchTab('scan')">Scan</div>
            <div class="tab" onclick="switchTab('jobs')">Jobs</div>
            <div class="tab" onclick="switchTab('chat')">Vizi Chat</div>
        </div>

        <div id="dashboard">
            <div class="section-header header-consumable">🧤 Consumables</div>
            <table>
                <thead><tr><th>Item</th><th>Qty</th><th>Actions</th></tr></thead>
                <tbody id="consumableTable"></tbody>
            </table>

            <div class="section-header header-reusable">🔧 Reusables</div>
            <table>
                <thead><tr><th>Item</th><th>Qty</th><th>Actions</th></tr></thead>
                <tbody id="reusableTable"></tbody>
            </table>
        </div>

        <div id="scan" style="display: none;">
            <div class="upload-card">
                <h3>Scan Equipment</h3>
                <button class="primary" onclick="document.getElementById('fileInput').click()">📂 Browse Files</button>
                <input type="file" id="fileInput" style="display:none;" accept="image/*" onchange="scan(this.files[0])">
                <div id="loadingIndicator">
                    <div class="spinner"></div>
                    <p>AI Analyzing...</p>
                </div>
            </div>
        </div>

        <div id="jobs" style="display: none;">
            <div style="background: #1a1d29; padding: 20px; border-radius: 8px;">
                <h3>Create Job</h3>
                <input type="text" id="jobName" placeholder="Job Name">
                <input type="text" id="jobLoc" placeholder="Location" oninput="updateMap()">
                <div id="map"></div>
                <button class="primary" onclick="addJob()">Save Job</button>
            </div>
            <table style="margin-top: 20px;">
                <thead><tr><th>Job</th><th>Status</th></tr></thead>
                <tbody id="jobTable"></tbody>
            </table>
        </div>

        <div id="chat" style="display: none;">
            <div style="background: #1a1d29; padding: 20px; border-radius: 8px;">
                <h3>Vizi Assistant</h3>
                <div class="chat-messages" id="chatMsgs"><div class="message ai">Hello! How can I help you?</div></div>
                <input type="text" id="chatInput" placeholder="Ask Vizi..." onkeydown="if(event.key==='Enter') sendChat()">
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://lymobhzjswiuymcbcabq.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_dz-2RaJJ2ZS0v301P5SuPQ_0LSEFSjT';
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let user = null;
        let inventory = [];
        let jobs = [];
        let map, marker;

        const industry = document.getElementById('industrySelector');

        async function checkAuth() {
            const { data } = await db.auth.getUser();
            if (data.user) { user = data.user; loadData(); }
            else window.location.href = "index.html";
        }

        async function logout() { await db.auth.signOut(); window.location.href = "index.html"; }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('#dashboard, #scan, #jobs, #chat').forEach(d => d.style.display = 'none');
            document.getElementById(tab).style.display = 'block';
            if (tab === 'jobs') setTimeout(initMap, 100);
        }

        // THE MAIN FIX: No filter by industry. Just loads items safely.
        async function loadData() {
            const inv = await db.from('inventory').select('*').eq('user_id', user.id);
            inventory = inv.data || [];
            const job = await db.from('jobs').select('*').eq('user_id', user.id);
            jobs = job.data || [];
            renderInventory();
            renderJobs();
        }

        function renderInventory() {
            const consumableTbody = document.getElementById('consumableTable');
            const reusableTbody = document.getElementById('reusableTable');
            consumableTbody.innerHTML = '';
            reusableTbody.innerHTML = '';
            
            inventory.forEach(i => {
                const row = `<tr><td>${i.manufacturer || "Unknown"} ${i.name || ""}</td><td>${i.qty || 0}</td><td><button class="small" onclick="editQty('${i.id}', ${i.qty})">Edit</button> <button class="small" onclick="deleteItem('${i.id}')">Del</button></td></tr>`;
                if (i.item_type === 'Consumable') consumableTbody.innerHTML += row;
                else reusableTbody.innerHTML += row;
            });
        }

        async function editQty(id, qty) {
            const newQty = prompt("New quantity:", qty);
            if (newQty !== null) {
                await db.from('inventory').update({ qty: parseInt(newQty) }).eq('id', id);
                loadData();
            }
        }

        async function deleteItem(id) {
            if (confirm("Delete item?")) {
                await db.from('inventory').delete().eq('id', id);
                loadData();
            }
        }

        function renderJobs() {
            const tbody = document.getElementById('jobTable');
            tbody.innerHTML = '';
            jobs.forEach(j => tbody.innerHTML += `<tr><td>${j.job_name}</td><td>${j.status || "Open"}</td></tr>`);
        }

        function initMap() {
            if (!map) { map = L.map('map').setView([-26.2041, 28.0473], 6); L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map); }
            else map.invalidateSize();
        }

        function updateMap() {
            const loc = document.getElementById('jobLoc').value;
            if (!loc || !map) return;
            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(loc)}`)
                .then(r => r.json()).then(d => {
                    if (d.length > 0) {
                        if (!marker) marker = L.marker([d[0].lat, d[0].lon]).addTo(map);
                        else marker.setLatLng([d[0].lat, d[0].lon]);
                        map.setView([d[0].lat, d[0].lon], 12);
                    }
                });
        }

        async function addJob() {
            const jobData = { job_name: document.getElementById('jobName').value, job_location: document.getElementById('jobLoc').value, status: 'Open' };
            const id = Date.now().toString(36);
            await db.from('jobs').insert([{ id, user_id: user.id, ...jobData }]);
            document.getElementById('jobName').value = '';
            document.getElementById('jobLoc').value = '';
            loadData();
        }

        async function scan(file) {
            document.getElementById('loadingIndicator').style.display = 'block';
            const reader = new FileReader();
            const imgData = await new Promise((resolve) => { reader.onload = e => resolve(e.target.result); reader.readAsDataURL(file); });
            const res = await puter.ai.chat("Identify this item. Return ONLY JSON: { 'name': '...', 'manufacturer': '...', 'category': '...', 'item_type': 'Consumable or Reusable', 'qty': 1, 'minStock': 1, 'status': 'In Stock' }", imgData, { model: "gpt-4o" });
            let text = res.message.content;
            const start = text.indexOf('{'); const end = text.lastIndexOf('}');
            const data = JSON.parse(text.substring(start, end + 1));
            
            // Save item with industry tag based on dropdown
            data['industry'] = industry.value;
            const id = Date.now().toString(36);
            await db.from('inventory').insert([{ id, user_id: user.id, ...data }]);
            
            document.getElementById('loadingIndicator').style.display = 'none';
            loadData();
            switchTab('dashboard');
        }

        async function sendChat() {
            const msg = document.getElementById('chatInput').value;
            if (!msg) return;
            const chatMsgs = document.getElementById('chatMsgs');
            chatMsgs.innerHTML += `<div class="message user">${msg}</div>`;
            document.getElementById('chatInput').value = '';
            let answer = "Offline.";
            try {
                const res = await puter.ai.chat("Answer this briefly: " + msg, { model: "gpt-4o-mini" });
                answer = res.message.content;
            } catch (e) {}
            chatMsgs.innerHTML += `<div class="message ai">${answer}</div>`;
            chatMsgs.scrollTop = chatMsgs.scrollHeight;
        }

        checkAuth();
    </script>
</body>
</html>
